services:
  brrr:
    build: .
    image: brrr:latest
    container_name: brrr
    # runs the LATEST implementation (implementations/event-loop-lazy-buffers/brrr.c)
    command: ["8080", "2"] # 2 workers for the 2 vCPU envelope
    ports:
      - "8080:8080"
    volumes:
      - brrr-data:/data
    # ---- the resource envelope: 2 vCPU, 500 MiB RAM, no swap escape hatch ----
    cpus: "2.0"
    mem_limit: 500m
    memswap_limit: 500m # mem == memswap => swapping disabled
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1048576 # RAM is the wall now, not the fd table (1 conn = 1 fd)
        hard: 1048576
    restart: unless-stopped

volumes:
  brrr-data:
