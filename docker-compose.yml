services:
  brrr:
    build: .
    image: brrr:latest
    container_name: brrr
    # runs the LATEST implementation (implementations/event-loop-cells/brrr.c)
    command: ["8080", "1"] # 1 worker for the 1 vCPU envelope
    ports:
      - "8080:8080"
    volumes:
      - brrr-data:/data
    # ---- the resource envelope: 1 vCPU, 1 GiB RAM, no swap escape hatch ----
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g # mem == memswap => swapping disabled
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1048576 # RAM is the wall now, not the fd table (1 conn = 1 fd)
        hard: 1048576
    restart: unless-stopped

volumes:
  brrr-data:
